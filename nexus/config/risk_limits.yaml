# Risk limits. Governance-locked; agents cannot edit. Structural launch defaults only;
# owner-specific limits stay null (unconfirmed) and block dependent decisions.
version: 1
launch_defaults:
  max_gross_leverage: 1.0        # no leverage at launch
  allow_short: false
  allow_derivatives: false
owner_limits:                         # PROVISIONAL (2026-11-19): owner said "I don't care", delegating conservative defaults; revisit on request
  max_position_weight: 0.10           # a new or added position may not take a single name above 10% of the portfolio
  max_sleeve_drawdown: 0.25
  max_portfolio_drawdown: 0.25
  protected_from_sales: [VTI, VXUS, RSP]   # owner wants to keep his index funds: NEXUS never recommends selling or trimming them
data_quality:
  daily_bar_grace_minutes_after_close: 60   # latest daily bar must be the last session that closed >60 min ago
paper_sleeve_defaults:                # structural limits for simulated sleeves only (not the owner's real portfolio)
  max_position_weight: 0.25
  max_gross_leverage: 1.0
  min_instrument_tier_for_paper: R2
  min_instrument_tier_for_shadow: R3
