# Owner permissions. Governance-locked: edits are detected by governance.lock.json.
# Config can only NARROW authority; the hard-coded launch boundary in nexus/permissions.py always wins.
stage: 0
live_trading: false
broker_write: false
money_movement: false
max_instrument_capability_tier: R3     # R4 (future live eligible) is unavailable at launch
allowed_capabilities:
  - research
  - backtest
  - simulate_order
  - record_hypothetical_trade
  - read_only_portfolio
  - paper_broker_order
# Explicit owner authorization (not a loosening of the live ban: live_trading/broker_write stay false).
# Paper orders only, Alpaca paper endpoint only. Keys come from the environment, never from here.
paper_broker_authorization:
  granted_by: Garret
  granted_at: "2026-11-05T02:05:05Z"
  endpoint: https://paper-api.alpaca.markets
